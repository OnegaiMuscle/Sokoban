<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokoban Hexagonal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            max-width: 100vw;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .level-info {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .game-board {
            display: grid;
            gap: 1px;
            background: #34495e;
            padding: 10px;
            border-radius: 8px;
            max-width: 100%;
            overflow: auto;
            position: relative;
        }

        .cell {
            width: min(40px, calc(90vw / 16));
            height: min(40px, calc(90vw / 16));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(24px, calc(90vw / 20));
            border-radius: 3px;
            position: relative;
        }

        .wall { background: #7f8c8d; }
        .floor { background: #ecf0f1; }
        .target { background: #f39c12; }
        .empty { background: #ecf0f1; }

        .wall::after { content: '🧱'; }
        .target::after { content: '🎯'; }

        .game-entity {
            position: absolute;
            width: min(40px, calc(90vw / 16));
            height: min(40px, calc(90vw / 16));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(24px, calc(90vw / 20));
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .player {
            background: #3498db;
            z-index: 20;
        }

        .player::after {
            content: '👤';
        }

        .box {
            background: #e74c3c;
            z-index: 15;
        }

        .box::after {
            content: '📦';
        }

        .box.on-target {
            background: #27ae60;
        }

        .box.on-target::after {
            content: '✅';
        }

        .player.on-target {
            background: #9b59b6;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
        }

        .control-btn {
            padding: 15px;
            background: #3498db;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .control-btn:hover {
            background: #2980b9;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .empty-cell { grid-column: 2; }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            background: #27ae60;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #229954;
        }

        .victory-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #27ae60;
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        @media (max-width: 600px) {
            .stats {
                flex-direction: column;
                gap: 5px;
            }

            .control-btn {
                padding: 12px;
                font-size: 16px;
            }

            .game-board {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="level-info">Niveau <span id="level-number">1</span></div>
            <div class="stats">
                <div>Mouvements: <span id="moves">0</span></div>
                <div>Poussées: <span id="pushes">0</span></div>
            </div>
        </div>

        <div id="game-board" class="game-board"></div>

        <div class="controls">
            <div class="empty-cell"></div>
            <button class="control-btn" data-direction="up">↑</button>
            <div class="empty-cell"></div>
            <button class="control-btn" data-direction="left">←</button>
            <button class="control-btn" data-direction="down">↓</button>
            <button class="control-btn" data-direction="right">→</button>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="reset-btn">Recommencer</button>
            <button class="action-btn" id="prev-btn">Niveau précédent</button>
            <button class="action-btn" id="next-btn">Niveau suivant</button>
        </div>
    </div>

    <div id="victory-message" class="victory-message">
        <div>Niveau terminé !</div>
        <div style="margin-top: 10px; font-size: 16px;">
            <span id="final-moves"></span> mouvements, <span id="final-pushes"></span> poussées
        </div>
    </div>

    <script>
        // Domain Layer - Types et constantes
        const CellType = {
            WALL: '#',
            FLOOR: ' ',
            TARGET: '.',
            BOX: '$',
            BOX_ON_TARGET: '*',
            PLAYER: '@',
            PLAYER_ON_TARGET: '+'
        };

        const Direction = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        // Domain Layer - Entités et logique métier
        const createPosition = (x, y) => ({ x, y });

        const addPositions = (pos1, pos2) => ({
            x: pos1.x + pos2.x,
            y: pos1.y + pos2.y
        });

        const positionsEqual = (pos1, pos2) => pos1.x === pos2.x && pos1.y === pos2.y;

        const createGameState = (level, playerPos, boxes, targets, moves = 0, pushes = 0) => ({
            level,
            playerPos,
            boxes,
            targets,
            moves,
            pushes
        });

        const isValidPosition = (grid, pos) => {
            return pos.y >= 0 && pos.y < grid.length &&
                   pos.x >= 0 && pos.x < grid[0].length &&
                   grid[pos.y][pos.x] !== CellType.WALL;
        };

        const isBoxAt = (boxes, pos) => boxes.some(box => positionsEqual(box, pos));

        const isTargetAt = (targets, pos) => targets.some(target => positionsEqual(target, pos));

        const moveBox = (boxes, fromPos, toPos) =>
            boxes.map(box => positionsEqual(box, fromPos) ? toPos : box);

        const isLevelComplete = (boxes, targets) =>
            boxes.every(box => targets.some(target => positionsEqual(box, target)));

        const tryMove = (gameState, direction) => {
            const { level, playerPos, boxes, targets, moves, pushes } = gameState;
            const newPlayerPos = addPositions(playerPos, direction);

            if (!isValidPosition(level, newPlayerPos)) {
                return gameState;
            }

            if (!isBoxAt(boxes, newPlayerPos)) {
                return createGameState(level, newPlayerPos, boxes, targets, moves + 1, pushes);
            }

            const newBoxPos = addPositions(newPlayerPos, direction);

            if (!isValidPosition(level, newBoxPos) || isBoxAt(boxes, newBoxPos)) {
                return gameState;
            }

            const newBoxes = moveBox(boxes, newPlayerPos, newBoxPos);
            return createGameState(level, newPlayerPos, newBoxes, targets, moves + 1, pushes + 1);
        };

        // Infrastructure Layer - Données des niveaux (corrigés et résolvables)
        const levels = [
            [
                "####",
                "#@.#",
                "# $#",
                "####"
            ],
            [
                "#####",
                "#.@ #",
                "# $ #",
                "#   #",
                "#####"
            ],
            [
                "######",
                "#    #",
                "# $@ #",
                "# .  #",
                "######"
            ],
            [
                "#######",
                "#     #",
                "# $$  #",
                "# @   #",
                "#  .. #",
                "#######"
            ],
            [
                "#######",
                "#     #",
                "# $ $ #",
                "#  @  #",
                "# . . #",
                "#     #",
                "#######"
            ],
            [
                "########",
                "#      #",
                "# $$   #",
                "#   @  #",
                "#   $  #",
                "# ...  #",
                "########"
            ],
            [
                "#########",
                "#       #",
                "# $ $ $ #",
                "#   @   #",
                "#       #",
                "# . . . #",
                "#########"
            ],
            [
                "##########",
                "#        #",
                "# $$ $$  #",
                "#    @   #",
                "#        #",
                "# ..  .. #",
                "##########"
            ]
        ];

        const parseLevel = (levelData) => {
            const grid = levelData.map(row => row.split(''));
            let playerPos = null;
            const boxes = [];
            const targets = [];

            grid.forEach((row, y) => {
                row.forEach((cell, x) => {
                    const pos = createPosition(x, y);
                    switch (cell) {
                        case CellType.PLAYER:
                            playerPos = pos;
                            grid[y][x] = CellType.FLOOR;
                            break;
                        case CellType.PLAYER_ON_TARGET:
                            playerPos = pos;
                            targets.push(pos);
                            grid[y][x] = CellType.TARGET;
                            break;
                        case CellType.BOX:
                            boxes.push(pos);
                            grid[y][x] = CellType.FLOOR;
                            break;
                        case CellType.BOX_ON_TARGET:
                            boxes.push(pos);
                            targets.push(pos);
                            grid[y][x] = CellType.TARGET;
                            break;
                        case CellType.TARGET:
                            targets.push(pos);
                            break;
                    }
                });
            });

            return { grid, playerPos, boxes, targets };
        };

        // Application Layer - Cas d'usage
        const GameService = (() => {
            let currentState = null;
            let currentLevelIndex = 0;
            let initialState = null;
            let isMoving = false;

            const loadLevel = (levelIndex) => {
                if (levelIndex < 0 || levelIndex >= levels.length) return false;

                currentLevelIndex = levelIndex;
                const levelData = parseLevel(levels[levelIndex]);
                currentState = createGameState(
                    levelData.grid,
                    levelData.playerPos,
                    levelData.boxes,
                    levelData.targets
                );
                initialState = { ...currentState, boxes: [...currentState.boxes] };
                return true;
            };

            const movePlayer = async (direction) => {
                if (!currentState || isMoving) return null;

                const newState = tryMove(currentState, direction);
                if (newState !== currentState) {
                    isMoving = true;
                    currentState = newState;
                    return {
                        state: currentState,
                        isComplete: isLevelComplete(currentState.boxes, currentState.targets)
                    };
                }
                return null;
            };

            const resetLevel = () => {
                if (initialState) {
                    currentState = {
                        ...initialState,
                        boxes: [...initialState.boxes],
                        moves: 0,
                        pushes: 0
                    };
                    return currentState;
                }
                return null;
            };

            const setMoving = (moving) => {
                isMoving = moving;
            };

            const getCurrentState = () => currentState;
            const getCurrentLevelIndex = () => currentLevelIndex;
            const getTotalLevels = () => levels.length;
            const getIsMoving = () => isMoving;

            return {
                loadLevel,
                movePlayer,
                resetLevel,
                setMoving,
                getCurrentState,
                getCurrentLevelIndex,
                getTotalLevels,
                getIsMoving
            };
        })();

        // Presentation Layer - Interface utilisateur
        const UIController = (() => {
            const elements = {
                gameBoard: document.getElementById('game-board'),
                levelNumber: document.getElementById('level-number'),
                moves: document.getElementById('moves'),
                pushes: document.getElementById('pushes'),
                victoryMessage: document.getElementById('victory-message'),
                finalMoves: document.getElementById('final-moves'),
                finalPushes: document.getElementById('final-pushes')
            };

            let cellSize = 40;
            let boardCols = 0;

            const calculateCellSize = (gameState) => {
                const cols = gameState.level[0].length;
                const rows = gameState.level.length;
                const maxSize = Math.min(
                    Math.floor(90 * window.innerWidth / 100 / cols),
                    Math.floor(80 * window.innerHeight / 100 / rows),
                    40
                );
                return Math.max(20, maxSize);
            };

            const createEntity = (type, pos, id = null) => {
                const entity = document.createElement('div');
                entity.className = `game-entity ${type}`;
                if (id) entity.id = id;

                const left = pos.x * (cellSize + 1) + 10;
                const top = pos.y * (cellSize + 1) + 10;

                entity.style.left = `${left}px`;
                entity.style.top = `${top}px`;
                entity.style.width = `${cellSize}px`;
                entity.style.height = `${cellSize}px`;

                return entity;
            };

            const animateEntity = (entity, newPos) => {
                return new Promise(resolve => {
                    const left = newPos.x * (cellSize + 1) + 10;
                    const top = newPos.y * (cellSize + 1) + 10;

                    entity.style.left = `${left}px`;
                    entity.style.top = `${top}px`;

                    setTimeout(resolve, 300);
                });
            };

            const updateControlsState = (disabled) => {
                document.querySelectorAll('.control-btn').forEach(btn => {
                    btn.disabled = disabled;
                });
            };

            const renderBoard = (gameState) => {
                const { level, playerPos, boxes, targets } = gameState;
                const rows = level.length;
                const cols = level[0].length;
                boardCols = cols;

                cellSize = calculateCellSize(gameState);

                elements.gameBoard.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                elements.gameBoard.innerHTML = '';

                // Créer les cellules statiques
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const cell = document.createElement('div');
                        const pos = createPosition(x, y);
                        const cellType = level[y][x];

                        let className = 'cell ';
                        if (cellType === CellType.WALL) className += 'wall';
                        else if (isTargetAt(targets, pos)) className += 'target';
                        else className += 'floor';

                        cell.className = className;
                        cell.style.width = `${cellSize}px`;
                        cell.style.height = `${cellSize}px`;
                        elements.gameBoard.appendChild(cell);
                    }
                }

                // Créer les entités mobiles
                const player = createEntity('player', playerPos, 'player');
                if (isTargetAt(targets, playerPos)) {
                    player.classList.add('on-target');
                }
                elements.gameBoard.appendChild(player);

                boxes.forEach((boxPos, index) => {
                    const box = createEntity('box', boxPos, `box-${index}`);
                    if (isTargetAt(targets, boxPos)) {
                        box.classList.add('on-target');
                    }
                    elements.gameBoard.appendChild(box);
                });
            };

            const updateEntities = async (gameState, previousState) => {
                const { playerPos, boxes, targets } = gameState;
                const player = document.getElementById('player');

                updateControlsState(true);

                // Animer le joueur
                if (player && !positionsEqual(playerPos, previousState.playerPos)) {
                    await animateEntity(player, playerPos);

                    // Mettre à jour la classe du joueur
                    player.classList.toggle('on-target', isTargetAt(targets, playerPos));
                }

                // Animer les boîtes qui ont bougé
                const animations = [];
                boxes.forEach((boxPos, index) => {
                    const previousBoxPos = previousState.boxes[index];
                    if (previousBoxPos && !positionsEqual(boxPos, previousBoxPos)) {
                        const boxElement = document.getElementById(`box-${index}`);
                        if (boxElement) {
                            animations.push(animateEntity(boxElement, boxPos));
                        }
                    }
                });

                await Promise.all(animations);

                // Mettre à jour les classes des boîtes
                boxes.forEach((boxPos, index) => {
                    const boxElement = document.getElementById(`box-${index}`);
                    if (boxElement) {
                        boxElement.classList.toggle('on-target', isTargetAt(targets, boxPos));
                    }
                });

                updateControlsState(false);
                GameService.setMoving(false);
            };

            const updateStats = (gameState) => {
                elements.levelNumber.textContent = GameService.getCurrentLevelIndex() + 1;
                elements.moves.textContent = gameState.moves;
                elements.pushes.textContent = gameState.pushes;
            };

            const showVictory = (gameState) => {
                elements.finalMoves.textContent = gameState.moves;
                elements.finalPushes.textContent = gameState.pushes;
                elements.victoryMessage.style.display = 'block';

                setTimeout(() => {
                    elements.victoryMessage.style.display = 'none';
                    if (GameService.getCurrentLevelIndex() < GameService.getTotalLevels() - 1) {
                        GameService.loadLevel(GameService.getCurrentLevelIndex() + 1);
                        render();
                    }
                }, 2000);
            };

            const render = () => {
                const gameState = GameService.getCurrentState();
                if (gameState) {
                    renderBoard(gameState);
                    updateStats(gameState);
                }
            };

            return { render, updateEntities, updateStats, showVictory };
        })();

        // Input Adapter
        const InputHandler = (() => {
            const directionMap = {
                'ArrowUp': Direction.UP,
                'ArrowDown': Direction.DOWN,
                'ArrowLeft': Direction.LEFT,
                'ArrowRight': Direction.RIGHT,
                'w': Direction.UP,
                's': Direction.DOWN,
                'a': Direction.LEFT,
                'd': Direction.RIGHT
            };
            const handleMove = async (direction) => {
                if (GameService.getIsMoving()) return;

                const previousState = { ...GameService.getCurrentState(), boxes: [...GameService.getCurrentState().boxes] };
                const result = await GameService.movePlayer(direction);

                if (result) {
                    await UIController.updateEntities(result.state, previousState);
                    UIController.updateStats(result.state);

                    if (result.isComplete) {
                        UIController.showVictory(result.state);
                    }
                }
            };

            
            const setupKeyboardControls = () => {
                document.addEventListener('keydown', (e) => {
                    const direction = directionMap[e.key];
                    if (direction) {
                        e.preventDefault();
                        handleMove(direction);
                    }
                });
            };

            const setupTouchControls = () => {
                document.querySelectorAll('[data-direction]').forEach(button => {
                    button.addEventListener('click', () => {
                        const direction = Direction[button.dataset.direction.toUpperCase()];
                        handleMove(direction);
                    });
                });
            };

            const setupActionButtons = () => {
                document.getElementById('reset-btn').addEventListener('click', () => {
                    GameService.resetLevel();
                    UIController.render();
                });

                document.getElementById('prev-btn').addEventListener('click', () => {
                    const currentLevel = GameService.getCurrentLevelIndex();
                    if (GameService.loadLevel(currentLevel - 1)) {
                        UIController.render();
                    }
                });

                document.getElementById('next-btn').addEventListener('click', () => {
                    const currentLevel = GameService.getCurrentLevelIndex();
                    if (GameService.loadLevel(currentLevel + 1)) {
                        UIController.render();
                    }
                });
            };

            return {
                setupKeyboardControls,
                setupTouchControls,
                setupActionButtons
            };
        })();

        // Application Bootstrap
        const initGame = () => {
            GameService.loadLevel(0);
            UIController.render();
            InputHandler.setupKeyboardControls();
            InputHandler.setupTouchControls();
            InputHandler.setupActionButtons();
        };

        // Démarrage du jeu
        document.addEventListener('DOMContentLoaded', initGame);

        // Redimensionnement
        window.addEventListener('resize', () => {
            const gameState = GameService.getCurrentState();
            if (gameState) {
                UIController.render();
            }
        });
    </script>
</body>
</html>
